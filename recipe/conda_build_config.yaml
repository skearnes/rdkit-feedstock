# Selects which Python wrapper layer the `rdkit` output is built against. The value
# becomes the build-string prefix, so downstreams can pin a flavor through the
# `rdkit-boost` selector metapackage instead of pinning a bare build string.
# Upstream's two wrapper layers are mutually exclusive, so this is a single choice
# per build rather than a set of features.
wrapper_flavor:
  - boost
